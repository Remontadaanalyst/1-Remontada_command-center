<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remontada Command Center — Matchday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #090c0d;
    --panel: #14181a;
    --panel-2: #191f21;
    --line: #262c2e;
    --ink: #eef2f2;
    --dim: #7c8688;
    --home: #0b4f9c;
    --home-cuff: #d8dee2;
    --away: #a3181c;
    --away-cuff: #e8dfd2;
    --turf: #29d17c;
    --gold: #ffb300;
    --radar: #29d17c;
    --danger: #ff3b52;
    --display: 'Bebas Neue', sans-serif;
    --body: 'Inter', sans-serif;
  }

  *{box-sizing:border-box;}
  body{
    font-family: var(--body);
    background: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(41,209,124,0.07), transparent 60%), var(--bg);
    color: var(--ink); margin:0; padding:22px 16px 100px;
  }

  .masthead{ text-align:center; margin-bottom:16px; }
  .masthead .eyebrow{ font-family: var(--body); font-weight:700; letter-spacing:4px; font-size:11px; color: var(--turf); text-transform:uppercase; }
  h1{ font-family: var(--display); font-weight:400; letter-spacing:2px; font-size:38px; margin:2px 0 0; color:var(--ink); }

  /* Bias Detector Hover Effect (Optional enhancement) */
  .bias-detector-btn { transition: all 0.2s ease; }
  .bias-detector-btn:hover { background: rgba(41,209,124,0.2) !important; transform: translateY(-1px); }

  /* Live radar strip */
  #radar-box{
    background: var(--panel); border:1px solid var(--line); padding:9px 22px;
    border-radius:99px; font-size:13px; font-family: var(--body); font-weight:600;
    letter-spacing:0.5px; color: var(--dim); margin: 14px auto 22px; display:flex; align-items:center; gap:9px;
    justify-content:center; max-width:420px; transition:.25s;
  }
  #radar-box .dot{ width:8px;height:8px;border-radius:50%; background:var(--dim); transition:.25s; }
  .flash-radar{ border-color: var(--radar) !important; color: var(--ink) !important; box-shadow:0 0 22px rgba(41,209,124,0.25); }
  .flash-radar .dot{ background: var(--radar) !important; box-shadow:0 0 8px var(--radar); }

  .roster-container{ display:flex; gap:18px; margin-bottom:20px; flex-wrap:wrap; }
  .team-panel{ flex:1 1 380px; background: var(--panel); padding:16px 16px 18px; border-radius:16px; border:1px solid var(--line); }
  .panel-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; }
  .team-title{ margin:0; display:flex; flex-direction:column; }
  .team-title span.name{ font-family:var(--display); font-size:22px; letter-spacing:1px; line-height:1; }
  .team-title span.fmt{ font-size:11px; color:var(--dim); font-weight:600; letter-spacing:1px; margin-top:2px; }
  .home-title .name{ color:#4da3ff; }
  .away-title .name{ color:#ff6b6f; }

  .panel-actions{ display:flex; gap:6px; }
  .pill-btn{ background: var(--panel-2); color: var(--ink); border:1px solid var(--line); padding:10px 14px; min-height:40px; border-radius:9px; cursor:pointer; font-size:12px; font-weight:700; transition:.12s; }
  .pill-btn:hover{ border-color:#3a4245; background:#1f2628; }
  .pill-btn.auto{ background: rgba(41,209,124,0.12); border-color: rgba(41,209,124,0.4); color:var(--turf); }
  .pill-btn.clear{ background: rgba(255,59,82,0.08); border-color: rgba(255,59,82,0.3); color:#ff8a95; }

  .flash-tap{ transform:scale(0.92); filter:brightness(1.35); }

  .formation-row{ display:flex; justify-content:center; gap:18px; margin-bottom:14px; flex-wrap:wrap; }
  .bench-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:16px; margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); min-height:20px; }
  .bench-row:empty::before{ content:'Tap "+ Sub" to add bench players'; color:#4a5254; font-size:11px; font-style:italic; }

  /* ---- JERSEY ---- */
  .jersey-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .jersey{
    width:58px; height:70px; border-radius: 12px 12px 7px 7px / 12px 12px 22px 22px;
    position:relative; cursor:pointer;
    box-shadow: inset -4px -4px 10px rgba(0,0,0,0.45), inset 3px 3px 6px rgba(255,255,255,0.06), 0 6px 12px rgba(0,0,0,0.55);
    transition:.15s; z-index:1; border: 2px solid transparent; /* For selection highlighting */
  }
  /* Active Player Highlight */
  .jersey.selected-player { border: 2px solid var(--gold); box-shadow: 0 0 15px var(--gold); transform: translateY(-3px); }
  
  .jersey::before, .jersey::after{ content:''; position:absolute; top:6px; width:24px; height:34px; z-index:-1; box-shadow: inset -3px -3px 6px rgba(0,0,0,0.35); }
  .jersey::before{ left:-14px; transform:rotate(28deg); border-radius:9px 3px 3px 9px; }
  .jersey::after{ right:-14px; transform:rotate(-28deg); border-radius:3px 9px 9px 3px; }

  .jersey.home{ background: linear-gradient(160deg, #0e5fbc 0%, var(--home) 55%, #073a72 100%); }
  .jersey.home::before, .jersey.home::after{ background: linear-gradient(115deg, var(--home) 0 68%, var(--home-cuff) 68% 100%); }
  .jersey.away{ background: linear-gradient(160deg, #c2262b 0%, var(--away) 55%, #6e0f12 100%); }
  .jersey.away::before, .jersey.away::after{ background: linear-gradient(115deg, var(--away) 0 68%, var(--away-cuff) 68% 100%); }

  .jersey-collar{ position:absolute; top:-2px; left:50%; transform:translateX(-50%); width:24px; height:13px; background: var(--bg); border-radius:0 0 13px 13px; box-shadow: inset 0 3px 4px rgba(0,0,0,0.85); }
  .jersey.home .jersey-collar{ box-shadow: inset 0 3px 4px rgba(0,0,0,0.85), 0 3px 0 -1px var(--home-cuff); }
  .jersey.away .jersey-collar{ box-shadow: inset 0 3px 4px rgba(0,0,0,0.85), 0 3px 0 -1px var(--away-cuff); }
  .jersey-sheen{ position:absolute; inset:0; border-radius:inherit; pointer-events:none; background: linear-gradient(120deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 30%); }

  .jersey-number{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-top:14px; color:#f3f3f3; font-size:24px; font-weight:900; font-family:'Arial Black', sans-serif; text-shadow: 2px 2px 2px rgba(0,0,0,0.75), 0 0 8px rgba(255,255,255,0.15); outline:none; cursor:pointer; user-select:none; }
  .jersey-number:empty::before{ content:'?'; opacity:.5; }
  
  .name-tag{ max-width:64px; font-size:10px; font-weight:700; color: var(--dim); text-align:center; border-bottom:1px dashed transparent; padding:1px 2px; white-space:nowrap; overflow:hidden; }

  /* UI Buttons on Jersey */
  .delete-btn{ position:absolute; top:-10px; right:-10px; width:22px; height:22px; background: var(--danger); color:white; font-size:14px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; border:2px solid var(--bg); font-weight:bold; opacity:.88; transition:.12s; z-index: 10; }
  .star-btn{ position:absolute; top:-10px; left:-10px; width:22px; height:22px; background: #333; color:white; font-size:14px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; border:2px solid var(--bg); opacity:.88; transition:.12s; z-index: 10; }
  .jersey-wrap:hover .delete-btn, .jersey-wrap:hover .star-btn{ opacity:1; }
  .star-btn.is-starred { background: var(--gold); color: black; box-shadow: 0 0 10px var(--gold); }

  /* Drag & Drop */
  .jersey-wrap[draggable="true"]{ cursor:grab; }
  .empty-slot-box{ width:58px; height:70px; border-radius: 12px 12px 7px 7px / 12px 12px 22px 22px; border:2px dashed #333c3e; display:flex; align-items:center; justify-content:center; background: rgba(255,255,255,0.02); }

  /* action panel */
  .action-panel{ background: var(--panel); padding:16px; border-radius:16px; margin-bottom:18px; border:1px solid var(--line); text-align:center; }
  .action-panel h3{ margin:0 0 12px; font-family:var(--display); letter-spacing:1.5px; font-size:18px; color:var(--turf); font-weight:400; }
  .action-btn{ background: var(--panel-2); color: var(--ink); border:1px solid var(--line); padding:17px 26px; min-width:110px; min-height:54px; margin:5px; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; transition:.12s; }
  .action-btn:hover{ background: var(--turf); color:#062015; border-color:var(--turf); box-shadow:0 0 14px rgba(41,209,124,0.35); }

  /* event log strip */
  .event-log-panel{ background: var(--panel); padding:14px 16px; border-radius:16px; margin-bottom:18px; border:1px solid var(--line); }
  .event-log-panel h3{ margin:0 0 10px; font-family:var(--display); letter-spacing:1.5px; font-size:16px; color:var(--dim); font-weight:400; text-align:left; }
  .event-log{ display:flex; flex-direction:column-reverse; gap:6px; max-height:220px; overflow-y:auto; }
  .log-empty{ color:#4a5254; font-size:12px; font-style:italic; padding:6px 2px; }
  .log-entry{ display:flex; align-items:center; gap:10px; background: var(--panel-2); border:1px solid var(--line); border-left:3px solid var(--dim); padding:8px 12px; border-radius:8px; font-size:13px; animation: log-in .2s ease-out; }
  @keyframes log-in{ from{ opacity:0; transform:translateY(-4px);} to{ opacity:1; transform:translateY(0);} }

  /* SYSTEM CONTROLS (Floating Bottom Bar) */
  .system-controls { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:10px; z-index:50; background: var(--panel); padding: 10px; border-radius: 99px; border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,0.8); }
  .sys-btn { padding:12px 24px; font-size:14px; font-weight:800; border-radius:99px; cursor:pointer; border:none; transition:.15s; font-family:var(--body); white-space: nowrap; }
  .btn-undo { background: var(--danger); color: white; }
  .btn-bookmark { background: var(--gold); color: black; }
  .btn-export { background: #00c853; color: white; }
  .sys-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
  .sys-btn:active { transform: scale(0.95); }

  /* Numpad styling */
  #pad-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:99; display:none; }
  #number-pad{ position:fixed; z-index:100; display:none; flex-direction:column; gap:8px; width:196px; background: var(--panel); border:1px solid #3a4245; border-radius:16px; padding:12px; box-shadow:0 12px 32px rgba(0,0,0,0.6); }
  .pad-display{ text-align:center; font-family:'Arial Black', sans-serif; font-size:26px; color: var(--gold); background: var(--panel-2); border-radius:10px; padding:8px; min-height:20px; }
  .pad-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .pad-key{ background: var(--panel-2); color: var(--ink); border:1px solid var(--line); border-radius:10px; font-size:18px; font-weight:800; height:46px; cursor:pointer; }
  .pad-key.pad-ok{ grid-column: span 3; background: var(--turf); color:#062015; }

  /* ---- NEW MATCH TRIGGER (masthead) ---- */
  .new-match-btn{
    display:inline-block; background: rgba(255,179,0,0.12); border:1px solid rgba(255,179,0,0.4);
    color: var(--gold); padding:8px 16px; border-radius:99px; font-size:12px; font-weight:700;
    cursor:pointer; margin-top:10px; margin-left:8px; font-family: var(--body); transition:.2s;
  }
  .new-match-btn:hover{ background: rgba(255,179,0,0.22); transform: translateY(-1px); }

  /* ---- ACTIVE MATCH BAR ---- */
  #active-match-bar{
    display:none; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background: var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:10px 18px; max-width:640px; margin:14px auto 22px; font-size:12px;
  }
  .amb-left{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; color: var(--ink); font-weight:600; }
  .amb-left .amb-dot{ width:8px; height:8px; border-radius:50%; background: var(--turf); box-shadow:0 0 8px var(--turf); animation: amb-pulse 1.2s infinite; }
  @keyframes amb-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  .amb-sep{ color: var(--dim); }
  .amb-clock{ font-family:'Arial Black', sans-serif; letter-spacing:0.5px; color: var(--turf); }
  .amb-actions{ display:flex; gap:6px; }
  .amb-btn{ background: var(--panel-2); color: var(--ink); border:1px solid var(--line); padding:7px 13px; border-radius:99px; font-size:11px; font-weight:700; cursor:pointer; transition:.12s; }
  .amb-btn:hover{ border-color:#3a4245; background:#1f2628; }
  .amb-btn.end{ background: rgba(255,59,82,0.1); border-color: rgba(255,59,82,0.35); color:#ff8a95; }

  /* ---- MATCH SETUP MODAL ---- */
  #match-setup-backdrop{ position:fixed; inset:0; background:rgba(5,7,8,0.72); z-index:199; display:none; backdrop-filter: blur(2px); }
  #match-setup-modal{
    position:fixed; z-index:200; display:none; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(420px, 92vw); max-height:90vh; overflow-y:auto;
    background: var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:22px 22px 20px; box-shadow:0 20px 60px rgba(0,0,0,0.7);
  }
  #match-setup-modal .modal-eyebrow{ font-weight:700; letter-spacing:3px; font-size:11px; color: var(--turf); text-transform:uppercase; }
  #match-setup-modal h2{ font-family: var(--display); font-weight:400; letter-spacing:1.5px; font-size:26px; margin:2px 0 16px; color: var(--ink); }
  .modal-close{ position:absolute; top:14px; right:16px; background:none; border:none; color: var(--dim); font-size:22px; cursor:pointer; line-height:1; }
  .modal-close:hover{ color: var(--ink); }
  .modal-field{ margin-bottom:12px; text-align:left; }
  .modal-field label{ display:block; font-size:11px; font-weight:700; color: var(--dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:5px; }
  .modal-field input{ width:100%; background: var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:11px 12px; color: var(--ink); font-size:14px; font-family: var(--body); }
  .modal-field input:focus{ outline:none; border-color: var(--turf); }
  .modal-row{ display:flex; gap:10px; }
  .modal-row .modal-field{ flex:1; }
  .modal-error{ color:#ff8a95; font-size:12px; min-height:16px; margin:2px 2px 8px; text-align:left; }
  .btn-start-match{
    width:100%; background: var(--turf); color:#062015; border:none; padding:14px;
    border-radius:12px; font-size:15px; font-weight:800; cursor:pointer; transition:.12s; margin-top:4px;
  }
  .btn-start-match:hover{ filter:brightness(1.1); }

  /* ---- JERSEY META: position ---- */
  .meta-row{ display:flex; flex-direction:column; gap:2px; width:60px; margin-top:2px; }
  .pos-select{
    width:100%; background: var(--panel-2); border:1px solid var(--line); border-radius:5px;
    color:#9fb0b3; font-size:9px; font-weight:700; font-family: var(--body);
    padding:2px 1px; text-align:center; cursor:pointer;
  }
  .pos-select:focus{ outline:none; border-color: var(--turf); color: var(--ink); }
/* ============================================================
   VOICE INPUT — Hold-to-Speak
   ============================================================ */
.voice-btn{
  background: linear-gradient(135deg, rgba(41,209,124,0.12), rgba(41,209,124,0.03));
  border:1px solid rgba(41,209,124,0.35);
  color: var(--turf);
  position:relative;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}
.voice-btn:disabled{
  opacity:0.35; cursor:not-allowed; filter:grayscale(1);
}
.voice-btn.listening{
  animation: voice-pulse 1.1s ease-in-out infinite;
  border-color: var(--turf);
  box-shadow: 0 0 22px rgba(41,209,124,0.35);
  color:#062015;
  background: var(--turf);
}
@keyframes voice-pulse{
  0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(41,209,124,0.45); }
  50%{ transform:scale(1.03); box-shadow:0 0 0 12px rgba(41,209,124,0); }
}
/* Waveform bars inside button */
.voice-waveform{
  display:flex; align-items:flex-end; gap:3px; height:18px;
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  opacity:0; transition:opacity .2s;
}
.voice-btn.listening .voice-waveform{ opacity:1; }
.voice-bar{
  width:3px; background:#062015; border-radius:99px;
  animation: wave-bounce .45s ease-in-out infinite alternate;
}
.voice-bar:nth-child(1){ height:7px; animation-delay:0s; }
.voice-bar:nth-child(2){ height:14px; animation-delay:.1s; }
.voice-bar:nth-child(3){ height:10px; animation-delay:.2s; }
@keyframes wave-bounce{
  from{ transform:scaleY(.35); }
  to{ transform:scaleY(1); }
}
/* Status text below button */
.voice-status{
  text-align:center; font-size:12px; color:var(--dim);
  margin-top:10px; min-height:18px; transition:color .25s;
  font-weight:600; letter-spacing:0.3px;
}
.voice-status.listening{ color:var(--turf); }
.voice-status.processing{ color:var(--gold); }
.voice-status.confirmed{ color:var(--turf); }
.voice-status.error{ color:var(--danger); }
/* Floating toast confirmation */
.voice-toast{
  position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-12px);
  background:var(--panel); border:1px solid var(--line);
  border-radius:14px; padding:12px 22px; z-index:200;
  display:flex; align-items:center; gap:10px;
  font-size:13px; font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,0.7);
  opacity:0; pointer-events:none; transition:all .35s cubic-bezier(.4,0,.2,1);
  white-space:nowrap;
}
.voice-toast.visible{ opacity:1; transform:translateX(-50%) translateY(0); }
.voice-toast.success{ border-color:rgba(41,209,124,0.45); }
.voice-toast.error{ border-color:rgba(255,59,82,0.4); color:var(--danger); }
.confidence-pill{
  background:rgba(41,209,124,0.14); color:var(--turf);
  padding:3px 10px; border-radius:99px; font-size:11px; font-weight:800;
  border:1px solid rgba(41,209,124,0.25);
}
</style>
</head>
<body>

  <div class="masthead">
    <div class="eyebrow">Live Tagging</div>
    <h1>Remontada Command Center</h1>
    <!-- Connected Bias Detector Button Below -->
    <a href="bias-detector.html" class="bias-detector-btn" style="display:inline-block;background:rgba(41,209,124,0.12);border:1px solid rgba(41,209,124,0.4);color:var(--turf);padding:8px 16px;border-radius:99px;font-size:12px;font-weight:700;text-decoration:none;margin-top:10px;">🔍 Bias Detector</a>
    <a href="report-generatorai.html" class="report-gen-btn" style="display:inline-block;background:rgba(255,179,0,0.12);border:1px solid rgba(255,179,0,0.4);color:var(--gold);padding:8px 16px;border-radius:99px;font-size:12px;font-weight:700;text-decoration:none;margin-top:10px;margin-left:8px;">📄 Report Generator</a>
    <a href="index.html" target="_blank" rel="noopener" class="live-pitch-btn" title="Opens in a new tab — required for live tap syncing to work" style="display:inline-block;background:rgba(41,209,124,0.12);border:1px solid rgba(41,209,124,0.4);color:var(--turf);padding:8px 16px;border-radius:99px;font-size:12px;font-weight:700;text-decoration:none;margin-top:10px;margin-left:8px;">📡 Live Pitch ↗</a>
    <button class="new-match-btn" onclick="flashTap(this); openMatchSetup()">🏟️ New Match</button>
  </div>

  <div id="active-match-bar">
    <div class="amb-left">
      <span class="amb-dot"></span>
      <span id="amb-name">—</span>
      <span class="amb-sep">·</span>
      <span id="amb-comp">—</span>
      <span class="amb-sep">·</span>
      <span id="amb-date">—</span>
      <span class="amb-sep">·</span>
      <span class="amb-clock" id="amb-clock">00:00</span>
    </div>
    <div class="amb-actions">
      <button class="amb-btn end" onclick="flashTap(this); endActiveMatch()">🏁 End Match</button>
    </div>
  </div>

  <div id="radar-box"><span class="dot"></span><span id="radar-text">Waiting for pitch input…</span></div>

  <div class="roster-container">
    <div class="team-panel">
      <div class="panel-header">
        <div class="team-title home-title"><span class="name" id="home-team-name">Home Squad</span><span class="fmt">4-3-3</span></div>
        <div class="panel-actions">
          <button class="pill-btn auto" onclick="flashTap(this); autoFillXI('home')">⚡ Reset 11</button>
          <button class="pill-btn" onclick="flashTap(this); addPlayer('home-bench','home')">+ Sub</button>
        </div>
      </div>
      <div class="formation-row" id="home-fwd"></div>
      <div class="formation-row" id="home-mid"></div>
      <div class="formation-row" id="home-def"></div>
      <div class="formation-row" id="home-gk"></div>
      <div class="bench-row" id="home-bench"></div>
    </div>

    <div class="team-panel">
      <div class="panel-header">
        <div class="team-title away-title"><span class="name" id="away-team-name">Opponent</span><span class="fmt">4-3-3</span></div>
        <div class="panel-actions">
          <button class="pill-btn auto" onclick="flashTap(this); autoFillXI('away')">⚡ Reset 11</button>
          <button class="pill-btn" onclick="flashTap(this); addPlayer('away-bench','away')">+ Sub</button>
        </div>
      </div>
      <div class="formation-row" id="away-fwd"></div>
      <div class="formation-row" id="away-mid"></div>
      <div class="formation-row" id="away-def"></div>
      <div class="formation-row" id="away-gk"></div>
      <div class="bench-row" id="away-bench"></div>
    </div>
  </div>

  <div class="action-panel">
    <h3>Tag Event</h3>
    <button class="action-btn" onclick="flashTap(this); fuseEvent('⚽','Pass','pass')">⚽ Pass</button>
    <button class="action-btn" onclick="flashTap(this); fuseEvent('🎯','Shot','shot')">🎯 Shot</button>
    <button class="action-btn" onclick="flashTap(this); fuseEvent('🛡️','Tackle','tackle')">🛡️ Tackle</button>
    <button class="action-btn" onclick="flashTap(this); fuseEvent('⚠️','Turnover','turnover')">⚠️ Turnover</button>
    <button class="action-btn voice-btn" id="voiceBtn">🎙️ Hold to Speak</button>
    <div class="voice-status" id="voiceStatus">Tap &amp; hold microphone to tag by voice</div>
  </div>

  <div class="event-log-panel">
    <h3>Event Log (Last 30)</h3>
    <div class="event-log" id="event-log"><div class="log-empty">No events tagged yet</div></div>
  </div>

  <!-- Enterprise Control Bar -->
  <div class="system-controls">
    <button class="sys-btn btn-bookmark" onclick="flashTap(this); bookmarkPlay()">⭐ Bookmark Play</button>
    <button class="sys-btn btn-undo" onclick="flashTap(this); undoLast()">⏪ Undo Play</button>
    <button class="sys-btn btn-export" onclick="flashTap(this); exportCSV()">📥 Export CSV</button>
  </div>

  <!-- Match Setup -->
  <div id="match-setup-backdrop" onclick="closeMatchSetup()"></div>
  <div id="match-setup-modal">
    <button class="modal-close" onclick="closeMatchSetup()">×</button>
    <div class="modal-eyebrow">Match Setup</div>
    <h2>Start a Match</h2>

    <div class="modal-row">
      <div class="modal-field">
        <label>Home Team</label>
        <input id="setup-home" type="text" placeholder="FC Mizoram" oninput="syncMatchNamePreview()">
      </div>
      <div class="modal-field">
        <label>Away Team</label>
        <input id="setup-away" type="text" placeholder="Kolkata United" oninput="syncMatchNamePreview()">
      </div>
    </div>

    <div class="modal-field">
      <label>Match Name</label>
      <input id="setup-name" type="text" placeholder="Auto-fills from teams above" oninput="this.dataset.userEdited='true'">
    </div>

    <div class="modal-row">
      <div class="modal-field">
        <label>Match Date</label>
        <input id="setup-date" type="date">
      </div>
      <div class="modal-field">
        <label>Competition</label>
        <input id="setup-competition" type="text" placeholder="I-League 2nd Division">
      </div>
    </div>

    <div class="modal-error" id="setup-error"></div>
    <button class="btn-start-match" onclick="flashTap(this); startNewMatch()">▶ Start Match</button>
  </div>

  <!-- Numpad -->
  <div id="pad-backdrop" onclick="closeNumberPad()"></div>
  <div id="number-pad">
    <div class="pad-display" id="pad-display">?</div>
    <div class="pad-grid">
      <button class="pad-key" onclick="flashTap(this); padDigit('1')">1</button>
      <button class="pad-key" onclick="flashTap(this); padDigit('2')">2</button>
      <button class="pad-key" onclick="flashTap(this); padDigit('3')">3</button>
      <button class="pad-key" onclick="flashTap(this); padDigit('4')">4</button>
      <button class="pad-key" onclick="flashTap(this); padDigit('5')">5</button>
      <button class="pad-key" onclick="flashTap(this); padDigit('6')">6</button>
      <button class="pad-key" onclick="flashTap(this); padDigit('7')">7</button>
      <button class="pad-key" onclick="flashTap(this); padDigit('8')">8</button>
      <button class="pad-key" onclick="flashTap(this); padDigit('9')">9</button>
      <button class="pad-key pad-back" onclick="flashTap(this); padBackspace()">⌫</button>
      <button class="pad-key" onclick="flashTap(this); padDigit('0')">0</button>
      <button class="pad-key" onclick="closeNumberPad()">✓</button>
      <button class="pad-key pad-ok" onclick="closeNumberPad()">Done</button>
    </div>
  </div>

<script>
  // --- CORE DATA PIPELINE STATE ---
  let masterMatchData = []; 
  let pendingLocation = { x: "N/A", y: "N/A" }; 
  let activePlayerNode = null; 

  function buildJersey(team, number, position){
    position = position || 'MID';
    const wrap = document.createElement('div');
    wrap.className = 'jersey-wrap';
    wrap.dataset.team = team;
    wrap.dataset.starred = "false";
    wrap.draggable = true;

    wrap.innerHTML = `
      <div class="star-btn" onclick="toggleStar(event, this)">☆</div>
      <div class="delete-btn" onclick="deletePlayer(event, this)">×</div>
      <div class="jersey ${team}" onclick="selectPlayer(this)">
        <div class="jersey-sheen"></div>
        <div class="jersey-collar"></div>
        <div class="jersey-number" onclick="openNumberPad(event, this)">${number}</div>
      </div>
      <div class="name-tag" contenteditable="true" onblur="syncPlayersToMatch()"></div>
      <div class="meta-row">
        <select class="pos-select" onclick="event.stopPropagation()" onchange="syncPlayersToMatch()">
          <option value="GK" ${position === 'GK' ? 'selected' : ''}>GK</option>
          <option value="DEF" ${position === 'DEF' ? 'selected' : ''}>DEF</option>
          <option value="MID" ${position === 'MID' ? 'selected' : ''}>MID</option>
          <option value="FWD" ${position === 'FWD' ? 'selected' : ''}>FWD</option>
        </select>
      </div>
    `;

    wrap.addEventListener('dragstart', e => { dragSource = wrap; wrap.classList.add('dragging'); });
    wrap.addEventListener('dragend', () => { wrap.classList.remove('dragging'); document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover')); });
    return wrap;
  }

  function positionFromContainer(containerId){
    if (containerId.endsWith('-fwd')) return 'FWD';
    if (containerId.endsWith('-mid')) return 'MID';
    if (containerId.endsWith('-def')) return 'DEF';
    if (containerId.endsWith('-gk')) return 'GK';
    return 'MID'; // bench subs default to MID, editable per-player
  }

  function addPlayer(containerId, team, number) {
    const position = positionFromContainer(containerId);
    document.getElementById(containerId).appendChild(buildJersey(team, number === undefined ? '' : number, position));
    syncPlayersToMatch();
  }
  
  function deletePlayer(e, btn){
    e.stopPropagation();
    flashTap(btn);
    const wrap = btn.closest('.jersey-wrap');
    if (activePlayerNode === wrap.querySelector('.jersey')) { activePlayerNode = null; }
    if (wrap.parentElement.classList.contains('bench-row')) { wrap.remove(); } 
    else { wrap.replaceWith(buildEmptySlot(wrap.dataset.team)); }
    syncPlayersToMatch();
  }

  function buildEmptySlot(team){
    const slot = document.createElement('div');
    slot.className = 'jersey-wrap empty-slot';
    slot.dataset.team = team || '';
    slot.innerHTML = `<div class="empty-slot-box"><span>Empty</span></div>`;
    return slot;
  }

  // --- STATE MACHINE: PLAYER SELECTION ---
  function selectPlayer(jerseyElement) {
    // Clear previous selection
    if (activePlayerNode) { activePlayerNode.classList.remove('selected-player'); }
    // Set new selection
    activePlayerNode = jerseyElement;
    activePlayerNode.classList.add('selected-player');
  }

  // --- STAR PLAYER TOGGLE ---
  function toggleStar(e, btn) {
    e.stopPropagation();
    flashTap(btn);
    const wrap = btn.closest('.jersey-wrap');
    let isStarred = wrap.dataset.starred === "true";
    
    if (isStarred) {
      wrap.dataset.starred = "false";
      btn.classList.remove('is-starred');
      btn.innerText = "☆";
    } else {
      wrap.dataset.starred = "true";
      btn.classList.add('is-starred');
      btn.innerText = "★";
    }
  }

  // --- EVENT FUSION LOGIC ---
  function fuseEvent(icon, label, kind) {
    if (!activePlayerNode) {
      alert("⚠️ Select a Player Jersey first!");
      return;
    }
    if (!activeMatchId) {
      alert("⚠️ Start a match first!");
      openMatchSetup();
      return;
    }

    const wrap = activePlayerNode.closest('.jersey-wrap');
    const team = wrap.dataset.team;
    const number = activePlayerNode.querySelector('.jersey-number').innerText || "Unknown";
    const nameEl = wrap.querySelector('.name-tag');
    const playerName = (nameEl && nameEl.textContent.trim()) || `Player #${number}`;
    const isStarred = wrap.dataset.starred === "true";
    const matchTime = currentMatchTime();

    // Build the Data Row (existing in-memory pipeline used by the log + CSV export)
    const newEvent = {
      timestamp: matchTime,
      team: team === "home" ? "Home" : "Away",
      player_id: number,
      event_type: label,
      x: pendingLocation.x,
      y: pendingLocation.y,
      is_star_player: isStarred,
      video_review: false // Default to false until Bookmark is hit
    };

    // Save to Master Database (in-memory, this session)
    masterMatchData.push(newEvent);

    // Persist to the active match record in localStorage (scoutai_matches)
    addEventToActiveMatch({
      time: matchTime,
      playerId: parseInt(number, 10) || number,
      playerName: playerName,
      team: team,
      eventType: label,
      x: pendingLocation.x,
      y: pendingLocation.y,
      isStarPlayer: isStarred,
      videoReview: false
    });

    // Update UI Log
    const logDesc = `${newEvent.team} #${newEvent.player_id} ${isStarred ? '⭐' : ''} - X:${newEvent.x} Y:${newEvent.y}`;
    renderEventLog(icon, label, kind, newEvent.timestamp, logDesc);

    // Reset temporary states for next play
    activePlayerNode.classList.remove('selected-player');
    activePlayerNode = null;
    pendingLocation = { x: "N/A", y: "N/A" }; 
    document.getElementById('radar-text').innerText = `Waiting for pitch input…`;
    document.getElementById('radar-box').classList.remove('flash-radar');
  }

  // --- UI LOG RENDERING ---
  function renderEventLog(icon, label, kind, time, desc){
    const box = document.getElementById('event-log');
    if(masterMatchData.length === 1) { box.innerHTML = ''; } // Clear empty message

    const logHTML = `
      <div class="log-entry ${kind}">
        <span class="log-icon">${icon}</span>
        <span class="log-label">${label} <span style="font-size:10px; color:var(--dim); font-weight:normal;">(${desc})</span></span>
        <span class="log-time">${time}</span>
      </div>`;
    box.insertAdjacentHTML('afterbegin', logHTML);
  }

  // --- MASTER UNDO STACK ---
  function undoLast(){
    if(masterMatchData.length === 0) return;
    masterMatchData.pop(); // Remove from memory
    removeLastEventFromActiveMatch(); // Remove from the persisted match record

    // Refresh UI log
    const box = document.getElementById('event-log');
    box.removeChild(box.firstChild);
    if(masterMatchData.length === 0) { box.innerHTML = '<div class="log-empty">No events tagged yet</div>'; }
  }

  // --- 10-TAP VIDEO BOOKMARK ---
  function bookmarkPlay() {
    if(masterMatchData.length === 0) return;
    
    // Flag the last 10 events (or less if 10 haven't happened yet)
    let limit = Math.min(10, masterMatchData.length);
    for(let i = masterMatchData.length - 1; i >= masterMatchData.length - limit; i--) {
      masterMatchData[i].video_review = true;
    }
    alert(`⭐ Synced! The last ${limit} actions have been flagged for the film room.`);
  }

  // --- CSV EXPORTER ---
  function exportCSV() {
    if(masterMatchData.length === 0) {
      alert("No data to export yet!");
      return;
    }

    let csvContent = "data:text/csv;charset=utf-8,";
    csvContent += "Timestamp,Team,Player_ID,Event_Type,X_Coord,Y_Coord,Star_Player,Video_Review\n";

    masterMatchData.forEach(row => {
      csvContent += `${row.timestamp},${row.team},${row.player_id},${row.event_type},${row.x},${row.y},${row.is_star_player},${row.video_review}\n`;
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);

    const match = getActiveMatchRecord();
    const fileSlug = match
      ? `${match.homeTeam}_vs_${match.awayTeam}_${match.date}`.replace(/[^a-z0-9]+/gi, '_')
      : `Remontada_Match_Report_${new Date().toLocaleDateString().replace(/\//g, '-')}`;
    link.setAttribute("download", `${fileSlug}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  // --- INVISIBLE BRIDGE LISTENER ---
  window.addEventListener('storage', function(event){
    if (event.key === 'remontada_live_tap') {
      const data = JSON.parse(event.newValue);
      
      // Save coordinate to pending state
      pendingLocation.x = data.x;
      pendingLocation.y = data.y;
      pendingLocation.matchTime = data.matchTime || null; // elapsed clock time from the pitch page, if sent

      const radar = document.getElementById('radar-box');
      document.getElementById('radar-text').innerText = `Locked X: ${data.x}, Y: ${data.y}`;
      radar.classList.add('flash-radar');
    }
  });

  // --- UTILS & NUMPAD ---
  function flashTap(el){ el.classList.add('flash-tap'); setTimeout(() => el.classList.remove('flash-tap'), 140); }
  function autoFillXI(team){ ['fwd','mid','def','gk'].forEach(part => document.getElementById(`${team}-${part}`).innerHTML = ''); addPlayer(`${team}-gk`, team, 1); [2,3,4,5].forEach(n => addPlayer(`${team}-def`, team, n)); [6,7,8].forEach(n => addPlayer(`${team}-mid`, team, n)); [9,10,11].forEach(n => addPlayer(`${team}-fwd`, team, n)); }
  function buildEmptyFormation(team){ for(let i=0;i<3;i++) addPlayer(`${team}-fwd`, team, ''); for(let i=0;i<3;i++) addPlayer(`${team}-mid`, team, ''); for(let i=0;i<4;i++) addPlayer(`${team}-def`, team, ''); addPlayer(`${team}-gk`, team, ''); }
  
  let padTarget = null; let padBuffer = '';
  function openNumberPad(e, numEl){
    e.stopPropagation();
    if (padTarget && padTarget !== numEl) padTarget.classList.remove('pad-open');
    padTarget = numEl; padTarget.classList.add('pad-open');
    padBuffer = numEl.textContent.trim();
    document.getElementById('pad-display').textContent = padBuffer || '?';
    
    const pad = document.getElementById('number-pad');
    pad.style.display = 'flex';
    const rect = numEl.getBoundingClientRect();
    pad.style.left = Math.max(8, Math.min(rect.left + rect.width / 2 - pad.offsetWidth / 2, window.innerWidth - pad.offsetWidth - 8)) + 'px';
    pad.style.top = (rect.bottom + 10 + pad.offsetHeight > window.innerHeight - 8 ? rect.top - pad.offsetHeight - 10 : rect.bottom + 10) + 'px';
    document.getElementById('pad-backdrop').style.display = 'block';
  }
  function padDigit(d){ padBuffer = (padBuffer + d).slice(-2); updatePadDisplay(); }
  function padBackspace(){ padBuffer = padBuffer.slice(0, -1); updatePadDisplay(); }
  function updatePadDisplay(){ document.getElementById('pad-display').textContent = padBuffer || '?'; if(padTarget) padTarget.textContent = padBuffer; }
  function closeNumberPad(){ if (padTarget) padTarget.classList.remove('pad-open'); padTarget = null; document.getElementById('pad-backdrop').style.display = 'none'; document.getElementById('number-pad').style.display = 'none'; syncPlayersToMatch(); }

  // ================= MATCH PERSISTENCE LAYER =================
  // Key: "scoutai_matches" — array of match objects, shared with index.html / bias-detector.html
  const MATCHES_KEY = 'scoutai_matches';
  const ACTIVE_KEY = 'scoutai_active_match_id';
  let activeMatchId = localStorage.getItem(ACTIVE_KEY) || null;
  let matchKickoffMs = null;
  let matchClockInterval = null;

  const EVENT_META = {
    Pass: { icon: '⚽', kind: 'pass' },
    Shot: { icon: '🎯', kind: 'shot' },
    Tackle: { icon: '🛡️', kind: 'tackle' },
    Turnover: { icon: '⚠️', kind: 'turnover' }
  };

  function loadMatches(){
    try { return JSON.parse(localStorage.getItem(MATCHES_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveMatches(matches){ localStorage.setItem(MATCHES_KEY, JSON.stringify(matches)); }

  function setActiveMatchId(id){
    activeMatchId = id;
    if (id) { localStorage.setItem(ACTIVE_KEY, id); }
    else { localStorage.removeItem(ACTIVE_KEY); }
  }

  function getActiveMatchRecord(){
    if (!activeMatchId) return null;
    return loadMatches().find(m => m.matchId === activeMatchId) || null;
  }

  function updateActiveMatch(mutator){
    if (!activeMatchId) return;
    const matches = loadMatches();
    const idx = matches.findIndex(m => m.matchId === activeMatchId);
    if (idx === -1) return;
    mutator(matches[idx]);
    saveMatches(matches);
  }

  function pad2(n){ return n.toString().padStart(2, '0'); }
  function formatMatchClock(totalSeconds){
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return `${pad2(m)}:${pad2(s)}`;
  }
  // Prefer the elapsed time sent straight from the pitch page's tap; otherwise
  // fall back to this page's own kickoff-based clock (for events tagged manually here).
  function currentMatchTime(){
    if (pendingLocation.matchTime) return pendingLocation.matchTime;
    if (!matchKickoffMs) return '00:00';
    return formatMatchClock(Math.floor((Date.now() - matchKickoffMs) / 1000));
  }

  // --- Players: rebuilt from the live jersey DOM whenever a roster field changes ---
  function syncPlayersToMatch(){
    if (!activeMatchId) return;
    const players = [];
    document.querySelectorAll('.jersey-wrap:not(.empty-slot)').forEach(wrap => {
      const numEl = wrap.querySelector('.jersey-number');
      const number = numEl ? numEl.textContent.trim() : '';
      if (!number) return; // skip jerseys with no number assigned yet
      const nameEl = wrap.querySelector('.name-tag');
      const posEl = wrap.querySelector('.pos-select');
      players.push({
        name: (nameEl && nameEl.textContent.trim()) || `Player #${number}`,
        number: parseInt(number, 10),
        team: wrap.dataset.team,
        position: posEl ? posEl.value : 'MID'
      });
    });
    updateActiveMatch(match => { match.players = players; });
  }

  // --- Events ---
  function addEventToActiveMatch(evt){
    if (!activeMatchId) return;
    updateActiveMatch(match => { match.events.push(evt); });
  }
  function removeLastEventFromActiveMatch(){
    if (!activeMatchId) return;
    updateActiveMatch(match => { match.events.pop(); });
  }

  // --- UI wiring for the active match ---
  function applyMatchToUI(match){
    document.getElementById('home-team-name').textContent = match.homeTeam;
    document.getElementById('away-team-name').textContent = match.awayTeam;

    document.getElementById('amb-name').textContent = match.matchName;
    document.getElementById('amb-comp').textContent = match.competition || '—';
    document.getElementById('amb-date').textContent = match.date;
    document.getElementById('active-match-bar').style.display = 'flex';

    // matchId embeds its own creation timestamp (match_<Date.now()>), so the
    // clock can resume correctly even after a page refresh mid-match.
    matchKickoffMs = parseInt(match.matchId.replace('match_', ''), 10) || Date.now();
    if (matchClockInterval) clearInterval(matchClockInterval);
    matchClockInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - matchKickoffMs) / 1000);
      document.getElementById('amb-clock').textContent = formatMatchClock(elapsed);
    }, 1000);
  }

  // --- Match Setup modal ---
  function syncMatchNamePreview(){
    const nameField = document.getElementById('setup-name');
    if (nameField.dataset.userEdited === 'true') return; // don't clobber a manual edit
    const home = document.getElementById('setup-home').value.trim();
    const away = document.getElementById('setup-away').value.trim();
    nameField.value = (home || away) ? `${home || '?'} vs ${away || '?'}` : '';
  }

  function openMatchSetup(){
    document.getElementById('setup-home').value = '';
    document.getElementById('setup-away').value = '';
    document.getElementById('setup-name').value = '';
    document.getElementById('setup-name').dataset.userEdited = 'false';
    document.getElementById('setup-competition').value = '';
    document.getElementById('setup-date').value = new Date().toISOString().slice(0, 10); // auto-filled today
    document.getElementById('setup-error').textContent = '';
    document.getElementById('match-setup-backdrop').style.display = 'block';
    document.getElementById('match-setup-modal').style.display = 'block';
  }
  function closeMatchSetup(){
    document.getElementById('match-setup-backdrop').style.display = 'none';
    document.getElementById('match-setup-modal').style.display = 'none';
  }
  function showSetupError(msg){ document.getElementById('setup-error').textContent = msg; }

  function startNewMatch(){
    const home = document.getElementById('setup-home').value.trim();
    const away = document.getElementById('setup-away').value.trim();
    let name = document.getElementById('setup-name').value.trim();
    const date = document.getElementById('setup-date').value;
    const competition = document.getElementById('setup-competition').value.trim();

    if (!home || !away) { showSetupError('Enter both team names to continue.'); return; }
    if (!date) { showSetupError('Pick a match date.'); return; }
    if (!name) name = `${home} vs ${away}`;

    if (activeMatchId) {
      const current = getActiveMatchRecord();
      const ok = confirm(`"${current ? current.matchName : 'A match'}" is still live. End it and start "${name}" instead?`);
      if (!ok) return;
      updateActiveMatch(m => { m.status = 'completed'; });
    }

    const matchId = `match_${Date.now()}`;
    const newMatch = {
      matchId, matchName: name, date, competition: competition || '',
      homeTeam: home, awayTeam: away,
      players: [], events: [], status: 'live'
    };

    const matches = loadMatches();
    matches.push(newMatch);
    saveMatches(matches);
    setActiveMatchId(matchId);

    applyMatchToUI(newMatch);
    closeMatchSetup();
    syncPlayersToMatch(); // capture whatever roster is already on screen
  }

  function endActiveMatch(){
    if (!activeMatchId) return;
    const current = getActiveMatchRecord();
    if (!confirm(`End "${current ? current.matchName : 'this match'}"? You can still export the CSV afterward.`)) return;
    updateActiveMatch(m => { m.status = 'completed'; });
    clearInterval(matchClockInterval);
    setActiveMatchId(null);
    document.getElementById('active-match-bar').style.display = 'none';
  }

  // --- Restore a live match after a page refresh ---
  function restoreMatchState(match){
    applyMatchToUI(match);

    (match.players || []).forEach(p => {
      const posLower = (p.position || 'mid').toLowerCase();
      const container = document.getElementById(`${p.team}-${posLower}`) || document.getElementById(`${p.team}-bench`);
      const wrap = buildJersey(p.team, p.number, p.position || 'MID');
      const nameEl = wrap.querySelector('.name-tag');
      if (nameEl && p.name && !p.name.startsWith('Player #')) nameEl.textContent = p.name;
      container.appendChild(wrap);
    });

    (match.events || []).forEach(evt => {
      masterMatchData.push({
        timestamp: evt.time,
        team: evt.team === 'home' ? 'Home' : 'Away',
        player_id: evt.playerId,
        event_type: evt.eventType,
        x: evt.x, y: evt.y,
        is_star_player: !!evt.isStarPlayer,
        video_review: !!evt.videoReview
      });
      const meta = EVENT_META[evt.eventType] || { icon: '📌', kind: '' };
      const desc = `${evt.team === 'home' ? 'Home' : 'Away'} #${evt.playerId} ${evt.isStarPlayer ? '⭐' : ''} - X:${evt.x} Y:${evt.y}`;
      renderEventLog(meta.icon, evt.eventType, meta.kind, evt.time, desc);
    });
  }

  // ================= INIT =================
  (function init(){
    const existing = activeMatchId ? loadMatches().find(m => m.matchId === activeMatchId) : null;
    if (existing && existing.status === 'live') {
      restoreMatchState(existing);
    } else {
      if (activeMatchId) setActiveMatchId(null); // stale id from a completed/removed match
      buildEmptyFormation('home');
      buildEmptyFormation('away');
      openMatchSetup();
    }
  })();
</script>

<script>
// ============================================================
// VOICE ENGINE — Hold-to-Speak Tagging
// Integrates with existing: selectPlayer(), fuseEvent(), 
// pendingLocation, activePlayerNode, masterMatchData
// ============================================================
const VoiceEngine = {
  recognition: null,
  isListening: false,
  holdStartTime: 0,
  MIN_HOLD_MS: 350,
  processedResult: false,

  /* --- Vocabulary Maps --- */
  NUMBER_WORDS: {
    "one":1,"two":2,"three":3,"four":4,"five":5,"six":6,"seven":7,"eight":8,"nine":9,"ten":10,
    "eleven":11,"twelve":12,"thirteen":13,"fourteen":14,"fifteen":15,"sixteen":16,"seventeen":17,
    "eighteen":18,"nineteen":19,"twenty":20,"thirty":30,"forty":40,"fifty":50,"sixty":60,
    "seventy":70,"eighty":80,"ninety":90
  },

  EVENT_KEYWORDS: [
    { keys:["pass"],            ev:"pass",     icon:"⚽", label:"Pass" },
    { keys:["shot","shoot"],    ev:"shot",     icon:"🎯", label:"Shot" },
    { keys:["tackle","tack"],   ev:"tackle",   icon:"🛡️", label:"Tackle" },
    { keys:["turnover","turn"], ev:"turnover", icon:"⚠️", label:"Turnover" },
    { keys:["goal","score"],    ev:"goal",     icon:"🥅", label:"Goal" }
  ],

  /* --- Init Speech API --- */
  init(){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition){
      this.showStatus("Voice API unavailable — use manual buttons","error");
      const btn=document.getElementById("voiceBtn");
      if(btn){ btn.disabled=true; btn.style.opacity="0.35"; }
      return false;
    }

    this.recognition = new SpeechRecognition();
    this.recognition.continuous = false;
    this.recognition.interimResults = false;
    this.recognition.lang = "en-US";
    this.recognition.maxAlternatives = 3;

    // Optional grammar hint (improves accuracy on Chrome)
    try{
      const SpeechGrammarList = window.SpeechGrammarList || window.webkitSpeechGrammarList;
      if(SpeechGrammarList){
        const g = new SpeechGrammarList();
        const nums = Object.keys(this.NUMBER_WORDS).join(" | ");
        const acts = this.EVENT_KEYWORDS.flatMap(k=>k.keys).join(" | ");
        g.addFromString(`#JSGF V1.0; grammar cmds; public <cmd> = (${nums}) (${acts});`,1);
        this.recognition.grammars = g;
      }
    }catch(e){/* grammars are optional */}

    this.recognition.onstart = ()=>{
      this.isListening = true;
      this.processedResult = false;
      this.setUIState("listening");
    };
    this.recognition.onend = ()=>{
      this.isListening = false;
      if(!this.processedResult) this.setUIState("idle");
    };
    this.recognition.onresult = (e)=>{
      this.processedResult = true;
      const best = e.results[0][0];
      this.handleTranscript(best.transcript.toLowerCase().trim(), best.confidence);
    };
    this.recognition.onerror = (e)=>{
      this.isListening = false;
      if(e.error==="no-speech"){
        this.showStatus("No speech heard — try again","error");
      }else if(e.error!=="aborted"){
        this.showStatus("Mic error: "+e.error,"error");
      }
      this.setUIState("idle");
    };
    return true;
  },

  /* --- Hold Controls --- */
  start(){
    this.processedResult = false;
    this.holdStartTime = Date.now();
    if(!this.recognition) this.init();
    if(!this.recognition) return;
    try{ this.recognition.start(); }catch(e){/* already started */}
  },
  stop(){
    const held = Date.now() - this.holdStartTime;
    if(held < this.MIN_HOLD_MS){
      try{ this.recognition.abort(); }catch(e){}
      this.setUIState("idle");
      return;
    }
    try{ this.recognition.stop(); }catch(e){ this.setUIState("idle"); }
  },

  /* --- Parse & Execute --- */
  handleTranscript(text, confidence){
    this.setUIState("processing");

    const parsed = this.parseCommand(text);
    if(!parsed){
      this.showToast(`❌ Unrecognized: "${text}"`,"error");
      this.showStatus('Try: "fourteen pass" · "seven tackle" · "twenty one shot"',"error");
      this.setUIState("idle");
      return;
    }

    const { number, eventKey, rawText } = parsed;
    const confPct = Math.round(confidence*100);

    // 1. Locate jersey by number across both teams
    const jersey = this.findJerseyByNumber(number);
    if(!jersey){
      this.showToast(`❌ Jersey #${number} not on pitch`,"error");
      this.showStatus(`Player #${number} not found in current squads`,"error");
      this.setUIState("idle");
      return;
    }

    // 2. Select player (sets activePlayerNode globally)
    selectPlayer(jersey);

    // 3. Resolve event config
    const evCfg = this.EVENT_KEYWORDS.find(k=>k.ev===eventKey);

    // 4. Fuse event after brief selection flash
    setTimeout(()=>{
      fuseEvent(evCfg.icon, evCfg.label, evCfg.ev);

      // 5. Attach voice metadata to the event we just pushed
      if(masterMatchData.length>0){
        const last = masterMatchData[masterMatchData.length-1];
        last.voiceCommand = rawText;
        last.voiceConfidence = confPct;
      }

      // 6. Inject confidence badge into the rendered log entry
      this.injectConfidenceBadge(confPct);

      // 7. Toast + status
      this.showToast(
        `✅ Tagged #${number} ${evCfg.label} <span class="confidence-pill">AI ${confPct}%</span>`,
        "success"
      );
      this.showStatus(`Tagged #${number} ${evCfg.label} · AI confidence ${confPct}%`,"confirmed");

      setTimeout(()=>this.setUIState("idle"), 2200);
    }, 280);
  },

  parseCommand(text){
    // Fix common misrecognitions
    text = text.replace(/\bfor\b/g,"four")
               .replace(/\b(too|to)\b/g,"two")
               .replace(/\btree\b/g,"three")
               .replace(/\bwon\b/g,"one")
               .replace(/[.,!?]/g,"");

    // Extract number (digits or words)
    const num = this.extractNumber(text);
    if(!num || num<1 || num>99) return null;

    // Extract event type (fuzzy)
    let eventKey = null;
    for(const rule of this.EVENT_KEYWORDS){
      if(rule.keys.some(k=>text.includes(k))){ eventKey = rule.ev; break; }
    }
    if(!eventKey) return null;

    return { number:num, eventKey, rawText:text };
  },

  extractNumber(text){
    // Digits first
    const d = text.match(/\b(\d{1,2})\b/);
    if(d) return parseInt(d[1]);

    // Word compounds: "twenty one" → 21, "forty five" → 45
    const words = text.split(/\s+/);
    let total = 0;
    for(const w of words){
      const clean = w.replace(/[^a-z]/g,"");
      if(this.NUMBER_WORDS[clean]) total += this.NUMBER_WORDS[clean];
    }
    return (total>0 && total<=99) ? total : null;
  },

  findJerseyByNumber(number){
    const str = String(number);
    for(const el of document.querySelectorAll('.jersey-number')){
      if(el.textContent.trim()===str) return el.closest('.jersey');
    }
    return null;
  },

  injectConfidenceBadge(pct){
    const box = document.getElementById('event-log');
    const entry = box.firstElementChild;
    if(!entry) return;
    const label = entry.querySelector('.log-label');
    if(label && !label.querySelector('.voice-conf')){
      label.insertAdjacentHTML('beforeend',
        ` <span class="voice-conf" style="color:var(--turf);font-size:10px;font-weight:700;">🎙️ ${pct}%</span>`
      );
    }
  },

  /* --- UI Helpers --- */
  setUIState(state){
    const btn = document.getElementById("voiceBtn");
    const status = document.getElementById("voiceStatus");
    if(!btn||!status) return;
    btn.classList.remove("listening");
    status.className = "voice-status";

    switch(state){
      case "listening":
        btn.classList.add("listening");
        btn.innerHTML = `🎙️ Listening… <div class="voice-waveform"><div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div></div>`;
        status.textContent = "Speak now: number + event";
        status.classList.add("listening");
        break;
      case "processing":
        btn.innerHTML = `⚙️ Processing…`;
        status.textContent = "AI parsing command…";
        status.classList.add("processing");
        break;
      case "confirmed":
        status.classList.add("confirmed");
        break;
      case "error":
        status.classList.add("error");
        break;
      default:
        btn.innerHTML = `🎙️ Hold to Speak`;
        status.textContent = "Tap & hold microphone to tag by voice";
    }
  },

  showStatus(msg,type){
    const el=document.getElementById("voiceStatus");
    if(!el) return;
    el.textContent=msg;
    el.className="voice-status "+(type||"");
  },

  showToast(html,type){
    let toast=document.getElementById("voiceToast");
    if(!toast){
      toast=document.createElement("div");
      toast.id="voiceToast"; toast.className="voice-toast";
      document.body.appendChild(toast);
    }
    toast.innerHTML=html;
    toast.className="voice-toast visible "+(type||"");
    clearTimeout(this._toastTimer);
    this._toastTimer=setTimeout(()=>toast.classList.remove("visible"),3200);
  }
};

/* --- Wire up mobile-safe hold events --- */
document.addEventListener('DOMContentLoaded',()=>{
  const btn=document.getElementById("voiceBtn");
  if(!btn) return;
  // Prevent default touch actions & context menu on long-press
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  btn.addEventListener('touchstart',e=>{ e.preventDefault(); VoiceEngine.start(); },{passive:false});
  btn.addEventListener('touchend',e=>{ e.preventDefault(); VoiceEngine.stop(); },{passive:false});
  // Desktop mouse fallback
  btn.addEventListener('mousedown',()=>VoiceEngine.start());
  btn.addEventListener('mouseup',()=>VoiceEngine.stop());
  btn.addEventListener('mouseleave',()=>{ if(VoiceEngine.isListening) VoiceEngine.stop(); });

  VoiceEngine.init();
});
</script>
</body>
